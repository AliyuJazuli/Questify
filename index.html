<!DOCTYPE html>
<html lang="en" data-theme="ocean">
<head>

  <link rel="stylesheet" href="style.css">

  <!-- PWA / Add to Home Screen support -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#071b2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Questify">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Questify",
      "url": "https://questify-hydev.netlify.app/",
      "description": "Build daily habits, track challenges, and stay focused with streaks, XP, badges, and a weekly calendar.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and a modern web browser.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="app">
    <div id="pull-refresh-indicator" class="pull-refresh-indicator" role="status" aria-live="polite" aria-hidden="true">
      <svg class="pull-refresh-indicator__mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="pull-refresh-logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
          </linearGradient>
        </defs>
        <circle class="pull-refresh-indicator__ring" cx="32" cy="32" r="29" />
        <g class="pull-refresh-indicator__logo">
          <rect class="pull-refresh-indicator__tile" x="2" y="2" width="60" height="60" rx="14" />
          <path class="pull-refresh-indicator__check" d="M18 32 27 41 47 20" />
        </g>
      </svg>
      <span id="pull-refresh-label">Pull to refresh</span>
    </div>
    <header class="app-header" id="app-header">
      <div class="container app-header__inner">
        <div class="app-sidebar-heading">
          <h1 class="app-header__logo">
            <img src="logo.svg" alt="" class="app-header__icon" width="28" height="28">
            <span class="nav-label">Questify</span>
          </h1>
          <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse navigation" aria-expanded="true" title="Collapse navigation">‹</button>
        </div>
        <nav class="app-nav" aria-label="Main navigation">
          <div class="app-nav-primary" aria-label="Primary destinations">
            <div class="app-nav-section" aria-label="Workspace">
              <span class="app-nav-section__label nav-label">Workspace</span>
              <button class="app-nav__btn" data-view="dashboard" aria-label="Dashboard" title="Dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Dashboard</span></button>
              <button class="app-nav__btn" data-view="habits" aria-label="Habits" title="Habits"><span class="nav-icon" aria-hidden="true">✓</span><span class="nav-label">Habits</span></button>
              <button class="app-nav__btn" data-view="calendar" aria-label="Calendar" title="Calendar"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Calendar</span></button>
              <button class="app-nav__btn" data-view="challenges" aria-label="Challenges" title="Challenges"><span class="nav-icon" aria-hidden="true">◎</span><span class="nav-label">Challenges</span></button>
            </div>
          </div>
          <div class="app-nav-secondary" aria-label="More destinations">
            <div class="app-nav-more-menu" id="app-nav-more">
              <div class="app-nav-section app-nav-section--more" aria-label="Progress">
                <span class="app-nav-section__label nav-label">Progress</span>
                <button class="app-nav__btn" data-view="badges" aria-label="Badges" title="Badges"><span class="nav-icon" aria-hidden="true">✦</span><span class="nav-label">Badges</span></button>
              </div>
              <div class="app-nav-section app-nav-section--more" aria-label="Account">
                <span class="app-nav-section__label nav-label">Account</span>
                <button class="app-nav__btn" data-view="profile" aria-label="Profile" title="Profile"><span class="nav-icon" aria-hidden="true">◉</span><span class="nav-label">Profile</span></button>
                <button class="app-nav__btn" data-view="settings" aria-label="Settings" title="Settings"><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-label">Settings</span></button>
              </div>
            </div>
            <button type="button" class="app-nav__btn app-nav__more-toggle" id="nav-more-toggle" aria-expanded="false" aria-controls="app-nav-more" aria-label="More navigation" title="More"><span class="nav-icon" aria-hidden="true">•••</span><span class="nav-label">More</span></button>
          </div>
        </nav>

        <div class="notif-bell-wrapper">
          <button
            id="notif-bell-btn"
            class="notif-bell-btn"
            aria-label="Notifications"
            aria-haspopup="true"
            aria-expanded="false"
          >
            🔔
            <span id="notif-badge" class="notif-badge is-hidden" aria-hidden="true">0</span>
          </button>
          <div id="notif-panel" class="notif-panel is-hidden">
            <div class="notif-panel__header">
              <h3>Notifications</h3>
              <button id="notif-clear-btn" class="btn-secondary btn-sm">Clear all</button>
            </div>
            <div id="notif-list" class="notif-list"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="container app-main" id="main-content" tabindex="-1">
      <!-- Dynamic content will render here via JS -->
    </main>

    <footer class="app-footer">
      <div class="container app-footer__inner">
        <div class="app-footer__brand">
          <span class="app-footer__brand-label text-muted">Built by</span>
          <div class="app-footer__logo-wrapper">
            <img src="hydev-logo.png" alt="HyDev logo" class="app-footer__logo">
          </div>
        </div>
        <p class="app-footer__text">&copy; 2026 HyDev. All rights reserved.</p>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>

  <!-- Service worker registration - additive only, never blocks app startup
       or touches localStorage. Safe no-op in browsers without support. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
