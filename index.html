<!DOCTYPE html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questify — Build habits, earn streaks</title>
  <meta name="description" content="Build daily habits, track challenges, and stay focused with Questify. Turn small wins into lasting routines with streaks, XP, badges, and a weekly calendar.">
  <meta name="author" content="HyDev">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="https://hydev-questify.netlify.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Questify">
  <meta property="og:title" content="Questify — Build habits, earn streaks">
  <meta property="og:description" content="Build daily habits, track challenges, and stay focused. Turn small wins into lasting routines with streaks, XP, badges, and a weekly calendar.">
  <meta property="og:url" content="https://hydev-questify.netlify.app/">
  <meta property="og:image" content="https://hydev-questify.netlify.app/social-preview.png">
  <meta property="og:image:secure_url" content="https://hydev-questify.netlify.app/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Questify — build habits, earn streaks. Your daily routine, one small win at a time.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Questify — Build habits, earn streaks">
  <meta name="twitter:description" content="Build daily habits, track challenges, and stay focused. Turn small wins into lasting routines.">
  <meta name="twitter:image" content="https://hydev-questify.netlify.app/social-preview.png">
  <meta name="twitter:image:alt" content="Questify — build habits, earn streaks. Your daily routine, one small win at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- PWA / Add to Home Screen support -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#071b2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Questify">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Questify",
      "url": "https://hydev-questify.netlify.app/",
      "description": "Build daily habits, track challenges, and stay focused with streaks, XP, badges, and a weekly calendar.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and a modern web browser.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="app">
    <header class="app-header" id="app-header">
      <div class="container app-header__inner">
        <h1 class="app-header__logo">
          <img src="logo.svg" alt="" class="app-header__icon" width="20" height="28">
          Questify 
        </h1>
        
        <nav class="app-nav" aria-label="Main navigation">
          <button class="app-nav__btn" data-view="dashboard">Dashboard</button>
          <button class="app-nav__btn" data-view="habits">Habits</button>
          <button class="app-nav__btn" data-view="challenges">Challenges</button>
          <button class="app-nav__btn" data-view="calendar">Calendar</button>
          <button class="app-nav__btn" data-view="badges">Badges</button>
          <button class="app-nav__btn" data-view="profile">Profile</button>
          <button class="app-nav__btn" data-view="settings">Settings</button>
        </nav>

        <div class="notif-bell-wrapper">
          <button
            id="notif-bell-btn"
            class="notif-bell-btn"
            aria-label="Notifications"
            aria-haspopup="true"
            aria-expanded="false"
          >
            🔔
            <span id="notif-badge" class="notif-badge is-hidden" aria-hidden="true">0</span>
          </button>
          <div id="notif-panel" class="notif-panel is-hidden">
            <div class="notif-panel__header">
              <h3>Notifications</h3>
              <button id="notif-clear-btn" class="btn-secondary btn-sm">Clear all</button>
            </div>
            <div id="notif-list" class="notif-list"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="container app-main" id="main-content" tabindex="-1">
      <!-- Dynamic content will render here via JS -->
    </main>

    <footer class="app-footer">
      <div class="container app-footer__inner">
        <div class="app-footer__brand">
          <span class="app-footer__brand-label text-muted">Built by</span>
          <div class="app-footer__logo-wrapper">
            <img src="hydev-logo.png" alt="HyDev logo" class="app-footer__logo">
          </div>
        </div>
        <p class="app-footer__text">&copy; 2026 HyDev. All rights reserved.</p>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>

  <!-- Service worker registration - additive only, never blocks app startup
       or touches localStorage. Safe no-op in browsers without support. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
